<!doctype html>
<html lang="it" data-theme="vivace">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#116962">
  <meta name="description" content="App della Parrocchia San Giovanni di Nettuno, con liturgia quotidiana CEI, Santo del giorno, Liturgia delle Ore, calendari catechesi e canti.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>San Giovanni · Nettuno — La nostra comunità</title>
  <style>
    :root {--forest:#21473d; --forest2:#345d4c; --forestdeep:#143b32; --cream:#f8f7f3; --paper:#fffefa; --sand:#f2eee7; --ink:#27342e; --muted:#7b8178; --line:#e9e6df; --amber:#bd8552; --amberlight:#f7e9d8; --blue:#496f8f; --bluepale:#e9f0f5; --shadow:0 12px 32px rgba(36,48,40,.055); --radius:18px}
    *,*::before,*::after {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {margin:0; color:var(--ink); background:var(--cream);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased}
    button,input,textarea,select {font:inherit}
    button {cursor:pointer}
    a {color:inherit;text-decoration:none}
    :focus-visible {outline:3px solid #c69a5e; outline-offset:2px}
    .app {min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}
    .sidebar {position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:30px 20px 20px;display:flex;flex-direction:column;gap:20px}
    .brand {display:flex;align-items:center;gap:12px;padding:0 6px 15px}
    .brand-icon {display:grid;place-items:center;border-radius:16px;width:50px;height:50px;min-width:50px;background:var(--forest);color:#fff}
    .brand-name {font:700 19px/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.3px}
    .brand-sub {font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:#888b83;margin-top:6px}
    .navlabel {font-size:10px;letter-spacing:1.7px;font-weight:750;color:#a09f97;text-transform:uppercase;padding:0 14px;margin:6px 0 5px}
    .nav {display:flex;flex-direction:column;gap:5px}
    .navlink {border:0;background:none;color:#667269;text-align:left;display:flex;gap:13px;align-items:center;border-radius:11px;padding:12px 14px;min-height:44px;font-weight:600;font-size:13px;width:100%;transition:.18s ease}
    .navlink:hover {background:#f4f2ec;color:var(--forest)}
    .navlink.active {background:#e7eee9;color:var(--forest);font-weight:750}
    .navlink svg {opacity:.85;flex:none}
    .side-foot {margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0;display:flex;flex-direction:column;gap:10px;color:#8a8c84;font-size:11px;line-height:1.5}
    .tag-demo {display:inline-flex;gap:6px;align-items:center;align-self:flex-start;color:var(--forest);border:1px solid #d4dfd6;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:750;letter-spacing:.4px}
    .main {min-width:0;padding:0 42px 70px}
    .topbar {height:92px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);max-width:1220px;margin:0 auto}
    .overline {font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:850}
    .top-head {font-size:14px;font-weight:700;margin-top:4px}
    .top-right {display:flex;align-items:center;gap:10px}
    .today-chip {font-size:12px;color:#7b8177;white-space:nowrap;margin-right:4px}
    .icon-btn {border:1px solid var(--line);background:var(--paper);width:39px;height:39px;display:grid;place-items:center;border-radius:12px;color:var(--forest)}
    .avatar {width:39px;height:39px;border-radius:12px;background:#e6eadd;display:grid;place-items:center;color:var(--forest);font-weight:800;font-size:12px}
    .content {max-width:1220px;margin:0 auto;padding-top:34px}
    .page-title {font:700 clamp(30px,3.4vw,42px)/1.14 Georgia,"Times New Roman",serif;letter-spacing:-1.1px;margin:10px 0 12px}
    .page-intro {font-size:14px;line-height:1.7;color:#727a70;max-width:740px;margin:0 0 30px}
    .section-heading {display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 0 16px}
    .section-heading h2 {margin:0;font:700 24px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.5px}
    .section-heading p {margin:6px 0 0;color:var(--muted);font-size:12px}
    .text-btn {border:0;background:none;color:var(--forest);font-size:12px;font-weight:750;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:8px}
    .text-btn:hover {text-decoration:underline}
    .hero {background:linear-gradient(115deg,#194436 0%,#2f5a48 66%,#416b53 100%);color:white;border-radius:22px;min-height:286px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(200px,.65fr);overflow:hidden;position:relative;box-shadow:0 20px 42px rgba(31,74,53,.12)}
    .hero::before {content:'';position:absolute;inset:-190px -160px auto auto;border:1px solid rgba(255,255,255,.13);width:480px;height:480px;border-radius:100%}
    .hero::after {content:'';position:absolute;inset:-155px -120px auto auto;border:1px solid rgba(255,255,255,.16);width:380px;height:380px;border-radius:100%}
    .hero-copy {padding:42px 40px;position:relative;z-index:1;max-width:650px}
    .hero-eyebrow {display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#d6c7a6}
    .hero-eyebrow::before {content:'';width:16px;height:1px;background:#d6c7a6}
    .hero h1 {font:700 clamp(36px,3.4vw,53px)/1.06 Georgia,"Times New Roman",serif;letter-spacing:-1.6px;margin:22px 0 13px}
    .hero p {font-size:14px;max-width:440px;color:#dce8dc;line-height:1.75;margin:0 0 24px}
    .btn {display:inline-flex;justify-content:center;align-items:center;gap:9px;padding:12px 17px;border-radius:11px;border:1px solid transparent;font-size:12px;font-weight:800;min-height:42px;transition:.16s ease}
    .btn:hover {transform:translateY(-1px)}
    .btn-primary {background:var(--forest);color:white}
    .btn-light {background:#fffdf6;color:var(--forest)}
    .btn-outline {background:transparent;border-color:#cddbd0;color:var(--forest)}
    .btn-ghost {background:#f2f2ed;color:var(--forest)}
    .btn-danger {background:#fff1ef;color:#ae5447}
    .hero-art {position:relative;display:flex;align-items:center;justify-content:center;z-index:1;min-height:220px;padding:18px 20px 18px 0}
    .hero-art img {width:100%;height:100%;max-height:250px;object-fit:contain;display:block;filter:drop-shadow(0 14px 28px rgba(10,46,42,.18))}
    .grid4 {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .quick-tile {background:var(--paper);border:1px solid var(--line);border-radius:16px;text-align:left;padding:18px 16px;min-height:126px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;box-shadow:var(--shadow);transition:.2s ease}
    .quick-tile:hover {border-color:#c6d2c7;transform:translateY(-2px)}
    .quick-icon {width:37px;height:37px;border-radius:10px;background:#edf1e8;color:var(--forest);display:grid;place-items:center}
    .quick-title {font-size:13px;font-weight:760}
    .quick-sub {font-size:10px;color:#969b90;margin-top:4px}
    .split {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.86fr);gap:20px}
    .panel {background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
    .panel-header {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
    .panel-header h3 {margin:0;font:700 21px/1.2 Georgia,"Times New Roman",serif}
    .notice-row {display:flex;gap:15px;align-items:flex-start;padding:17px 0;border-bottom:1px solid #efede7}
    .notice-row:last-child {border-bottom:none;padding-bottom:0}
    .mini-date {width:48px;min-width:48px;min-height:52px;text-align:center;background:#f5f2eb;border-radius:10px;padding:7px 2px;color:var(--forest)}
    .mini-date strong {display:block;font-size:20px;line-height:1.3}
    .mini-date span {display:block;color:#8d8a7f;font-size:9px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
    .notice-body {flex:1;min-width:0}
    .notice-body h4 {margin:6px 0;font-size:13px;line-height:1.4}
    .notice-body p {margin:0;color:#81877e;font-size:12px;line-height:1.6}
    .notice-row button.open {border:0;background:none;color:var(--forest);padding:5px;margin-top:13px}
    .category {font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#647968;font-weight:850}
    .event-panel {background:#f2ece1;border:1px solid #ede6d8;display:flex;flex-direction:column;gap:12px}
    .event-date {display:flex;gap:10px;align-items:center;color:var(--amber);font-size:11px;letter-spacing:1px;font-weight:850;text-transform:uppercase}
    .event-panel h3 {margin:0;font:700 29px/1.2 Georgia,"Times New Roman",serif;color:var(--forest)}
    .event-panel p {font-size:12px;line-height:1.7;color:#7f7c70;margin:0}
    .event-meta {display:flex;align-items:center;gap:10px;color:var(--forest);font-size:12px;font-weight:650;margin-top:auto}
    .event-meta svg {color:var(--amber)}
    .soft-note {display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border:1px solid #e5e9df;background:#eff3ed;color:#607565;border-radius:10px;font-size:11px;line-height:1.65}
    .soft-note svg {flex:none;margin-top:1px}
    .notice-banner {display:flex;gap:9px;align-items:center;margin-bottom:24px;color:#947b59;background:#faf3e8;padding:12px 15px;border:1px solid #f0e4d1;border-radius:10px;font-size:11px;line-height:1.5}
    .notice-banner svg {flex:none}
    .stats-row {display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
    .stat {padding:21px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
    .stat-val {font:700 30px Georgia,serif;color:var(--forest)}
    .stat-text {font-size:12px;color:#8c9289;margin-top:6px}
    .search-line {display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
    .input-wrap {display:flex;align-items:center;gap:10px;border:1px solid #e5e4dd;border-radius:12px;background:white;padding:0 13px;min-height:45px;flex:1;min-width:220px;color:#879086}
    .input-wrap input {border:0;outline:0;min-width:0;flex:1;font-size:13px;background:transparent}
    .filters {display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .pill {border:1px solid #e5e6dd;border-radius:30px;background:white;color:#8a8d83;padding:9px 13px;font-size:11px;font-weight:700}
    .pill.active {background:var(--forest);color:white;border-color:var(--forest)}
    .cards2 {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .info-card {border-radius:16px;padding:22px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
    .info-card h3 {margin:0;font:700 20px/1.3 Georgia,serif}
    .info-card p {font-size:12px;line-height:1.7;color:#81877e;margin:0;flex:1}
    .meta-line {font-size:11px;color:#8e938b;display:flex;gap:7px;align-items:center}
    .card-footer {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
    .calendar-shell {background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px;min-width:0}
    .calendar-top {display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .calendar-top h2 {margin:0;font:700 23px Georgia,serif}
    .cal-buttons {display:flex;gap:7px}
    .calendar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .weekday {font-size:10px;font-weight:800;text-align:center;color:#959a90;padding:5px 0 12px;text-transform:uppercase;letter-spacing:.4px}
    .cal-day {border:1px solid transparent;min-height:70px;border-radius:10px;background:#fbfaf7;color:#4f6658;text-align:left;padding:9px 10px;font-size:12px;font-weight:750;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
    .cal-day:hover {background:#edf1e9}
    .cal-day.blank {background:transparent;pointer-events:none}
    .cal-day.has-event {background:#f0f4ee}
    .cal-day.selected {background:var(--forest);color:#fff}
    .cal-day .dots {display:flex;gap:3px}
    .dot {width:5px;height:5px;border-radius:50%;background:var(--amber)}
    .cal-day.selected .dot {background:#e5c594}
    .calendar-layout {display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,.85fr);gap:16px}
    .day-events {background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px;min-height:325px}
    .day-events h3 {font:700 21px Georgia,serif;margin:0 0 19px}
    .day-evt {border-left:3px solid var(--amber);padding:9px 0 9px 13px;margin-bottom:12px}
    .day-evt strong {font-size:12px;display:block;margin-bottom:5px}
    .day-evt p {font-size:11px;color:#859085;line-height:1.6;margin:0}
    .empty-state {text-align:center;color:#90988e;padding:35px 15px;font-size:12px;line-height:1.7}
    .empty-state svg {margin-bottom:14px}
    .time-card {display:flex;gap:17px;align-items:center;padding:21px;border:1px solid var(--line);border-radius:15px;background:var(--paper);margin-bottom:12px}
    .time-icon {width:47px;height:47px;display:grid;place-items:center;background:#edf1e8;color:var(--forest);border-radius:13px;flex:none}
    .time-card h3 {margin:0 0 6px;font-size:14px}
    .time-card p {margin:0;color:#858c82;font-size:12px;line-height:1.7}
    .time-side {margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap;color:var(--forest)}
    .song-card {background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;gap:14px;align-items:center}
    .song-symbol {display:grid;place-items:center;width:45px;height:45px;border-radius:12px;flex:none;background:var(--amberlight);color:#aa7848}
    .song-main {flex:1;min-width:0}
    .song-main h3 {margin:0 0 5px;font-size:13px}
    .song-main p {margin:0;color:#8f968d;font-size:11px;line-height:1.6}
    .heart-btn {border:0;background:none;color:#a2a69d;display:grid;place-items:center;padding:8px}
    .heart-btn.active {color:#c27d57}
    .article {background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,44px);max-width:780px}
    .article h2 {font:700 31px/1.25 Georgia,serif;letter-spacing:-.7px;margin:10px 0 20px;color:var(--forest)}
    .article p {font:16px/1.95 Georgia,serif;color:#626b61;margin:15px 0}
    .quote-box {border-left:3px solid var(--amber);background:#faf4e8;padding:24px;margin:28px 0;font:italic 20px/1.65 Georgia,serif;color:var(--forest)}
    .family-card {background:linear-gradient(120deg,#245244,#456b54);border-radius:18px;padding:30px;color:#fff;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;margin-bottom:24px}
    .family-card h2 {margin:9px 0;font:700 26px Georgia,serif}
    .family-card p {margin:0;color:#d6e6d9;font-size:12px;line-height:1.75;max-width:520px}
    .group-mini {display:flex;gap:13px;align-items:center;justify-content:space-between;padding:16px;border:1px solid var(--line);border-radius:12px;background:white;margin-bottom:9px}
    .group-name {font-weight:760;font-size:13px}
    .group-detail {color:#92998d;font-size:11px;margin-top:5px;line-height:1.5}
    .label-tag {display:inline-block;border:1px solid #dbe5db;background:#ecf2eb;color:var(--forest);font-size:10px;font-weight:750;padding:6px 9px;border-radius:8px;white-space:nowrap}
    .form-grid {display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field {display:flex;flex-direction:column;gap:6px}
    .field.full {grid-column:1/-1}
    .field label {font-size:11px;font-weight:800;color:#53665a}
    .field input,.field textarea,.field select {width:100%;border:1px solid #dedfd7;border-radius:10px;background:#fff;padding:12px 13px;font-size:13px;color:var(--ink);outline:none}
    .field textarea {resize:vertical;min-height:115px}
    .field input:focus,.field textarea:focus,.field select:focus {border-color:#759484;box-shadow:0 0 0 3px #edf3ef}
    .form-actions {display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
    .donation-card {padding:27px;border-radius:17px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
    .donation-card .big-ic {color:var(--forest);background:#edf1e8;width:50px;height:50px;display:grid;place-items:center;border-radius:14px}
    .donation-card h3 {font:700 22px Georgia,serif;margin:0}
    .donation-card p {color:#828980;line-height:1.7;font-size:12px;margin:0;flex:1}
    .donation-card .btn {margin-top:10px;align-self:start}
    .modal-backdrop {position:fixed;inset:0;z-index:20;background:rgba(20,35,28,.52);display:grid;place-items:center;padding:20px;overflow-y:auto}
    .modal {background:var(--paper);padding:28px;border-radius:18px;max-width:520px;width:100%;box-shadow:0 22px 70px rgba(12,29,19,.25);position:relative}
    .modal h2 {font:700 28px/1.2 Georgia,serif;margin:12px 25px 16px 0}
    .modal p {line-height:1.8;color:#68746a;font-size:13px}
    .modal .close {position:absolute;right:18px;top:18px}
    .toast {pointer-events:none;position:fixed;bottom:28px;right:27px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--forestdeep);color:white;box-shadow:0 16px 30px rgba(20,60,43,.2);padding:14px 18px;border-radius:11px;font-size:12px;max-width:340px}
    .mobile-head,.bottom-nav,.more-menu {display:none}
    .minor {font-size:11px;line-height:1.7;color:#92988f}
    .pt0 {padding-top:0}.mt0 {margin-top:0}.mb0{margin-bottom:0}.mb20{margin-bottom:20px}.mt20{margin-top:20px}
    @media(max-width:1100px){.main {padding:0 24px 60px}.sidebar{width:225px;padding:26px 14px}.app{grid-template-columns:225px minmax(0,1fr)}.hero {grid-template-columns:1fr 210px}.hero-copy{padding:35px}.split{grid-template-columns:1.4fr 1fr}.hero h1{font-size:41px}}
    @media(max-width:850px){.sidebar{display:none}.app{display:block}.main{padding:0 18px 105px}.topbar{height:73px}.topbar .today-chip{display:none}.content{padding-top:21px}.hero{grid-template-columns:1fr 190px;min-height:250px}.hero-copy{padding:27px}.hero h1{font-size:34px}.hero-art img{max-height:205px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr 1fr}.calendar-layout{grid-template-columns:1fr}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(255,254,250,.96);border-top:1px solid var(--line);justify-content:space-around;padding:7px 6px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -12px 28px rgba(27,46,31,.035);backdrop-filter:blur(12px)}.bottom-nav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:center;color:#969e93;font-size:9px;font-weight:800;padding:6px 9px;min-width:57px}.bottom-nav button.active{color:var(--forest)}.more-menu{display:flex;flex-direction:column;position:fixed;z-index:10;bottom:76px;left:12px;right:12px;background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 45px rgba(19,41,27,.17);padding:12px;gap:5px}.more-menu[hidden]{display:none}.more-menu button{display:flex;align-items:center;gap:12px;border:0;padding:13px;border-radius:10px;background:transparent;text-align:left;color:var(--forest);font-size:13px;font-weight:700}.more-menu button:hover{background:#edf1e8}}

    }
    async function enablePush(){
      if(push.busy)return;
      if(!('Notification' in window)||!('PushManager' in window)||!('serviceWorker' in navigator)){push.status='unsupported';render();return;}
      // La richiesta del permesso parte direttamente dal click dell'utente.
      const asked=Notification.requestPermission();
      push.busy=true;push.error='';render();
      try{
        const permission=await asked;
        if(permission!=='granted'){push.status=permission==='denied'?'blocked':'disabled';return;}
        const reg=await navigator.serviceWorker.ready;
        const res=await fetch(pushUrl('push-key'),{cache:'no-store'});
        const cfg=await res.json();
        if(!res.ok)throw new Error(cfg.error||'Servizio notifiche non configurato');
        const vapid=Uint8Array.from(atob(cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(cfg.publicKey.length/4)*4,'=')),c=>c.charCodeAt(0));
        const existing=await reg.pushManager.getSubscription();
        const subscription=existing||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapid});
        const saved=await fetch(pushUrl('push-subscribe'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(subscription.toJSON())});
        const payload=await saved.json();
        if(!saved.ok)throw new Error(payload.error||'Salvataggio dell’iscrizione fallito');
        push.status='enabled';toast('Notifiche attivate su questo dispositivo.');
      }catch(e){push.status='error';push.error=e?.message||String(e);toast('Notifiche non attivate: '+push.error.slice(0,100))}
      finally{push.busy=false;render()}
    }
    async function disablePush(){
      if(push.busy)return;push.busy=true;render();
      try{
        const reg=await navigator.serviceWorker.ready;
        const subscription=await reg.pushManager.getSubscription();
        if(subscription){
          const res=await fetch(pushUrl('push-subscribe'),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify(subscription.toJSON())});
          const payload=await res.json();
          if(!res.ok)throw new Error(payload.error||'Rimozione della sottoscrizione fallita');
          await subscription.unsubscribe();
        }

      }catch(e){push.status='error';push.error=e?.message||String(e);toast('Non è stato possibile disattivare: '+push.error.slice(0,80));}
      finally{push.busy=false;render()}
    }

E</div><h3 style="font:700 23px Georgia,serif;margin:12px 0 8px">${esc(content.reflections.find(x=>x.published!==false)?.title||'Una parola per oggi')}</h3><div style="font-size:12px;color:#808b7f;line-height:1.6">${content.reflections.some(x=>x.published!==false)?'Leggi la riflessione condivisa dalla parrocchia.':'Nessuna meditazione pubblicata al momento.'}</div></div><button class="btn btn-outline" data-go="meditazioni">Leggi ${I('arrow',16)}</button></div>${cloud.enabled?'':`<p class="minor" style="margin-top:20px">Versione dimostrativa: nessun avviso viene pubblicato realmente.</p>`}`}
    function avvisi(){const cats=['Tutti','Liturgia','Catechesi','Giovani','Comunità'];const all=allNotices().filter(n=>(state.filter==='Tutti'||n.cat===state.filter)&&`${n.title} ${n.desc}`.toLowerCase().includes(state.search.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date));return `${head('RESTA AGGIORNATO','Avvisi e comunicazioni','Le notizie importanti della parrocchia, gli appuntamenti e le iniziative dei diversi gruppi.')}${sampleBanner()}${pushPanel()}<div class="search-line"><div class="input-wrap">${I('search',18)}<input id="notice-search" placeholder="Cerca un avviso..." value="${esc(state.search)}" aria-label="Cerca tra gli avvisi"></div><div class="filters">${cats.map(x=>`<button class="pill ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div></div><div class="cards2">${all.map(n=>`<article class="info-card"><div class="category">${esc(n.cat)} · ${dateFmt(n.date)}</div><h3>${esc(n.title)}</h3><p>${esc(n.desc.length>170?n.desc.slice(0,167)+'…':n.desc)}</p><div class="card-footer"><span class="meta-line">${I('users',15)} ${esc(n.audience||'Tutta la comunità')}</span><button class="text-btn" data-notice="${esc(n.id)}">Leggi ${I('arrow',15)}</button></div></article>`).join('')||'<div class="empty-state">Nessun avviso trovato. Prova un altro filtro.</div>'}</div>`}
    const mnames=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
    function calendario(){const start=(new Date(state.year,state.month,1).getDay()+6)%7;const days=new Date(state.year,state.month+1,0).getDate();let cells='';for(let b=0;b<start;b++) cells+='<div class="cal-day blank"></div>';for(let day=1;day<=days;day++){let dat=`${state.year}-${String(state.month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let evs=events.filter(x=>x.date===dat);cells+=`<button class="cal-day ${evs.length?'has-event':''} ${dat===state.selectedDate?'selected':''}" data-day="${dat}" aria-label="${dateFmt(dat)}${evs.length?', '+evs.length+' eventi':''}"><span>${day}</span><span class="dots">${evs.map(()=>'<i class="dot"></i>').join('')}</span></button>`}const dayE=events.filter(x=>x.date===state.selectedDate);return `${head('LA VITA PARROCCHIALE','Calendario','Tutti i prossimi incontri, le celebrazioni e le attività dei gruppi.')}${sampleBanner()}<div class="calendar-layout"><section class="calendar-shell"><div class="calendar-top"><h2>${mnames[state.month]} ${state.year}</h2><div class="cal-buttons"><button class="icon-btn" data-action="prev-month" aria-label="Mese precedente">${I('chevronleft',18)}</button><button class="icon-btn" data-action="next-month" aria-label="Mese successivo">${I('chevron',18)}</button></div></div><div class="calendar-grid">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></section><aside class="day-events"><div class="overline">APPUNTAMENTI DEL GIORNO</div><h3>${dateFmt(state.selectedDate)}</h3>${dayE.length?dayE.map(e=>`<div class="day-evt"><strong>${esc(e.time)} · ${esc(e.title)}</strong><p>${esc(e.where)}</p></div>`).join(''):`<div class="empty-state">${I('calendar',28)}<div>Non ci sono eventi inseriti per questa giornata.</div></div>`}<div class="soft-note" style="margin-top:25px">${I('info',16)} Il calendario completo verrà aggiornato dai responsabili parrocchiali.</div></aside></div>`}
    // Le transizioni dell'ora legale seguono il calendario Europe/Rome: ultima domenica
    // di marzo -> ora legale; ultima domenica di ottobre -> ora solare.
    function lastSunday(year,month){const day=new Date(Date.UTC(year,month,0));return day.getUTCDate()-day.getUTCDay()}
    function romeToday(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>parts.find(p=>p.type===k).value;return `${get('year')}-${get('month')}-${get('day')}`}
    function seasonForDate(iso){const y=Number(iso.slice(0,4)),start=`${y}-03-${String(lastSunday(y,3)).padStart(2,'0')}`,end=`${y}-10-${String(lastSunday(y,10)).padStart(2,'0')}`;return iso>=start&&iso<end?'legale':'solare'}
    function dayTypeForDate(iso){const [y,m,d]=iso.split('-').map(Number),weekday=new Date(Date.UTC(y,m-1,d)).getUTCDay();return weekday===0?'Festivo':'Feriale / Prefestivo'}
    function prettyDayType(iso){const [y,m,d]=iso.split('-').map(Number),w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return w===0?'Festivo':w===6?'Prefestivo':'Feriale'}
    function sortedTimeList(times){return String(times||'').split(',').map(x=>x.trim()).filter(Boolean).sort()}
    function massTimesMarkup(times){return `<div class="mass-times-list">${sortedTimeList(times).map(time=>`<span class="mass-time-chip">${esc(time)}</span>`).join('')}</div>`}
    function scheduleFor(season,dayType){return content.mass_schedule.find(x=>x.published!==false&&x.season===season&&x.day_type===dayType)}
    function exceptionFor(iso){return content.mass_exceptions.find(x=>x.published!==false&&x.date_on===iso&&(!x.collection_id||content.mass_collections.some(g=>String(g.id)===String(x.collection_id)&&g.published!==false)))}
    function dateMassInfo(iso){const exception=exceptionFor(iso),season=seasonForDate(iso),dayType=dayTypeForDate(iso);return {exception,season,dayType,record:exception||scheduleFor(season,dayType)}}
    function seasonCard(season){const active=seasonForDate(romeToday())===season;return `<section class="mass-season ${active?'is-current':''}"><div class="mass-season-top"><div><div class="overline">ORARIO ${season.toUpperCase()}</div><h3>${season==='solare'?'Ora solare':'Ora legale'}</h3></div>${active?'<span class="label-tag">In vigore</span>':''}</div>${['Feriale / Prefestivo','Festivo'].map(kind=>{const row=scheduleFor(season,kind);return `<div class="mass-season-row"><div><strong>${kind==='Feriale / Prefestivo'?'Feriale e prefestivo':'Festivo'}</strong></div>${row?massTimesMarkup(row.times_text):'<span class="minor">Orario da pubblicare</span>'}</div>`}).join('')}</section>`}
    function specialCollectionCard(col,rows){
      const shown=rows.filter(x=>x.published!==false).sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||a.date_on.localeCompare(b.date_on));
      if(!shown.length)return '';
      return `<section class="mass-collection"><div class="mass-season-top"><div><div class="overline">CELEBRAZIONI PARTICOLARI</div><h3>${esc(col.title)}</h3>${col.notes?`<p class="mass-note">${esc(col.notes)}</p>`:''}</div></div>${shown.map(x=>`<div class="mass-season-row"><div><strong>${esc(x.day_label||dateFmt(x.date_on))}</strong>${x.notes?`<small>${esc(x.notes)}</small>`:''}</div>${massTimesMarkup(x.times_text)}</div>`).join('')}</section>`;
    }
    function messe(){
      const iso=state.massDate||romeToday(),info=dateMassInfo(iso);
      const days=content.mass_exceptions.filter(x=>x.published!==false);
      const groups=[...content.mass_collections].filter(g=>g.published!==false).sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||a.title.localeCompare(b.title,'it'));
      const grouped=groups.map(group=>specialCollectionCard(group,days.filter(d=>String(d.collection_id||'')===String(group.id)))).filter(Boolean);
      const ungrouped=days.filter(d=>!d.collection_id);
      if(ungrouped.length)grouped.push(specialCollectionCard({title:'Altre celebrazioni',notes:''},ungrouped));
      return `${head('ORARI E CELEBRAZIONI','Orari delle Sante Messe','Orari ordinari secondo l’ora solare o legale e calendario delle celebrazioni particolari.')}${sampleBanner()}<section class="panel mass-day-box"><div class="mass-day-head"><div><div class="overline">VERIFICA GLI ORARI DI UN GIORNO</div><h2>${dateFmt(iso)}</h2><p>${info.exception?'Celebrazione particolare · '+esc(info.exception.day_label||info.exception.title):esc(prettyDayType(iso))+' · ora '+esc(info.season)}</p></div><div class="field"><label for="mass-date">Seleziona una data</label><input id="mass-date" type="date" value="${esc(iso)}"></div></div>${info.record?massTimesMarkup(info.record.times_text):'<div class="empty-state">Nessun orario pubblicato per questa data.</div>'}${info.exception&&info.exception.notes?`<p class="minor" style="margin-top:12px">${esc(info.exception.notes)}</p>`:''}</section><div class="section-heading"><div><h2>Orari ordinari</h2><p>Il calendario passa automaticamente da ora solare a ora legale e viceversa.</p></div></div><div class="mass-season-grid">${seasonCard('solare')}${seasonCard('legale')}</div><div class="section-heading"><div><h2>Celebrazioni particolari</h2><p>Ogni riquadro raccoglie le date e gli orari della ricorrenza; nei giorni indicati questi sostituiscono l’orario ordinario.</p></div></div>${grouped.length?`<div class="mass-collections-grid">${grouped.join('')}</div>`:'<div class="panel empty-state">Non sono ancora stati pubblicati orari particolari.</div>'}`;
    }
    const byOrder=(a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.name||a.title||'').localeCompare(String(b.name||b.title||''),'it');
    const allCategories=()=>[...content.song_categories].sort(byOrder);
    const allSlots=(categoryId)=>[...content.song_slots].filter(s=>!categoryId||String(s.category_id)===String(categoryId)).sort(byOrder);
    const publicCategories=()=>allCategories().filter(c=>c.published!==false);
    const publicSlots=(categoryId)=>allSlots(categoryId).filter(s=>s.published!==false);
    const getCategory=(id)=>content.song_categories.find(c=>String(c.id)===String(id));
    const getSlot=(id)=>content.song_slots.find(s=>String(s.id)===String(id));
    const publishedPlacementList=(categoryId,slotId)=>content.song_placements
      .filter(p=>p.published!==false && (slotId?String(p.slot_id)===String(slotId):String(getSlot(p.slot_id)?.category_id)===String(categoryId)))
      .map(p=>({...p,song:songs.find(s=>String(s.id)===String(p.song_id))}))
      .filter(p=>p.song && getSlot(p.slot_id)?.published!==false && getCategory(getSlot(p.slot_id)?.category_id)?.published!==false)
      .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||a.song.name.localeCompare(b.song.name,'it'));
    const songCountText=(count)=>count===1?'1 canto':count+' canti';
    function songCrumbs(){const cat=getCategory(state.songService),slot=getSlot(state.songMoment);return `<nav class="song-crumbs" aria-label="Percorso del repertorio"><button data-action="song-home">Canti</button>${cat?`${I('chevron',12)}<button data-action="song-slots">${esc(cat.name)}</button>`:''}${slot?`${I('chevron',12)}<strong>${esc(slot.name)}</strong>`:''}</nav>`}
    function canti(){

      if(!cat)return `${intro}${sampleBanner()}<div class="section-heading"><div><h2>Scegli il repertorio</h2><p>Le categorie vengono aggiornate dai responsabili della parrocchia.</p></div></div><div class="song-category-grid">${cats.length?cats.map((category,i)=>{const n=publishedPlacementList(category.id).length;return `<button class="song-service-card" data-song-service="${esc(category.id)}"><span class="symbol">${I(i===1?'users':'music',23)}</span><span class="song-service-name">${esc(category.name)}</span><span class="song-service-hint">${songCountText(n)} assegnati · ${publicSlots(category.id).length} momenti</span><span class="text-btn">Apri repertorio ${I('arrow',15)}</span></button>`}).join(''):'<div class="panel empty-state">I repertori non sono ancora stati pubblicati.</div>'}</div>`;
      const slots=publicSlots(cat.id);

      const arr=publishedPlacementList(cat.id,slot.id);
      return `${intro}${sampleBanner()}${songCrumbs()}<div class="section-heading"><div><h2>${esc(slot.name)}</h2><p>${esc(cat.name)} · ${songCountText(arr.length)}</p></div><button class="btn btn-outline" data-action="song-slots">${I('chevronleft',15)} Tutti i momenti</button></div><section class="song-lyrics-list">${arr.length?arr.map(p=>`<article class="song-lyrics-card"><div class="overline">${esc(slot.name)} · ${esc(cat.name)}</div><h3>${esc(p.song.name)}</h3>${p.song.lyrics.trim()?`<div class="song-lyrics">${richSongHtml(p.song.lyrics)}</div>`:'<div class="song-lyrics-empty">Testo non ancora inserito dal responsabile.</div>'}<div class="song-foot"><button class="text-btn" data-song="${esc(p.song.id)}">Visualizza canto ${I('arrow',15)}</button><button class="heart-btn ${state.favs.includes(p.song.id)?'active':''}" data-fav="${esc(p.song.id)}" aria-label="${state.favs.includes(p.song.id)?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}">${I('heart',20)}</button></div></article>`).join(''):'<div class="panel empty-state">Nessun canto pubblicato in questo momento. Gli amministratori possono assegnarlo tramite Programmi Messe.</div>'}</section><p class="minor" style="margin-top:18px">I testi completi devono essere inseriti soltanto se la parrocchia dispone delle necessarie autorizzazioni.</p>`;
    }
    function meditazioni(){const list=content.reflections.filter(x=>x.published!==false).sort((a,b)=>(b.date_on||'').localeCompare(a.date_on||''));return `${head('PREGHIERA QUOTIDIANA','Un momento di silenzio','Uno spazio semplice per leggere, riflettere e ritrovare il senso della giornata.')}${sampleBanner()}${list.length?list.map(x=>`<article class="article" style="margin-bottom:18px"><div class="overline">MEDITAZIONE · ${x.date_on?dateFmt(x.date_on):''}</div><h2>${esc(x.title)}</h2>${esc(x.body||'').split(/\n\s*\n|\n/).filter(Boolean).map(p=>`<p>${p}</p>`).join('')}</article>`).join(''):'<div class="panel"><div class="empty-state">Non ci sono ancora meditazioni pubblicate.</div></div>'}`}

function getCatechGroup(id){return content.catechism_groups.find(g=>String(g.id)===String(id))}
const catechCourses=['Primo anno','Secondo anno','Terzo anno','Cresima','Dopocomunione','Altro'];
const publicCatechGroups=()=>content.catechism_groups.filter(g=>g.published!==false).sort((a,b)=>(a.course||'').localeCompare(b.course||'','it')||(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||(a.name||'').localeCompare(b.name||'','it'));
const publicCatechMeetings=()=>content.catechism_meetings.filter(m=>m.published!==false && publicCatechGroups().some(g=>String(g.id)===String(m.group_id))).sort((a,b)=>(a.date_on+' '+String(a.time_of_day||'')).localeCompare(b.date_on+' '+String(b.time_of_day||'')));
function catechesi(){

  const selectedMeetings=allMeetings.filter(m=>ids.has(String(m.group_id)) && (state.catechPast || m.date_on>=now));
  const dateText=d=>new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short',weekday:'short'}).format(new Date(d+'T12:00:00'));
  return `${head('PERCORSI DI FEDE','Calendario catechesi','Seleziona il percorso e il gruppo per consultare le date dei prossimi incontri.')}${sampleBanner()}
    <div class="catech-filterbar" aria-label="Filtri del calendario catechesi">

      <div class="field"><label for="catech-group">Gruppo</label><select id="catech-group"><option value="Tutti">Tutti i gruppi</option>${courseGroups.map(g=>`<option value="${esc(g.id)}" ${String(state.catechGroup)===String(g.id)?'selected':''}>${esc(g.name)} · ${esc(g.course)}</option>`).join('')}</select></div>
      <button class="btn btn-outline" data-action="catech-reset">Tutti i gruppi</button>
    </div>
    <div class="section-heading"><div><h2>${selectedGroups.length===1?'Il tuo gruppo':'Gruppi di catechesi'}</h2><p>Le informazioni sono pubblicate dai responsabili della parrocchia.</p></div></div>
    <div class="catech-group-grid">${selectedGroups.length?selectedGroups.map(g=>{
      const next=allMeetings.filter(m=>String(m.group_id)===String(g.id)&&m.date_on>=now&&m.status!=='cancelled').slice(0,3);
      return `<article class="catech-group-card"><div class="overline">${esc(g.course)} · ${esc(g.school_year||'')}</div><h3>Gruppo ${esc(g.name)}</h3>${g.description?`<div class="catech-meta">${esc(g.description)}</div>`:''}${g.location?`<div class="catech-meta">${I('pin',14)} ${esc(g.location)}</div>`:''}<div class="catech-upcoming">${next.length?next.map(m=>`<span class="catech-date-tag">${dateText(m.date_on)} · ${esc(String(m.time_of_day||'').slice(0,5))}</span>`).join(''):'<span class="catech-meta">Nessun incontro futuro programmato.</span>'}</div><button class="btn btn-outline" data-catech-open="${esc(g.id)}" style="align-self:start;margin-top:7px">Vedi calendario ${I('arrow',15)}</button></article>`;
    }).join(''):'<div class="panel empty-state">Nessun gruppo pubblicato per il filtro selezionato.</div>'}</div>
    <div class="section-heading"><div><h2>Agenda degli incontri</h2><p>${selectedGroups.length===1?esc(selectedGroups[0].name)+' · ':''}${selectedMeetings.length} appuntamenti ${state.catechPast?'inclusi i precedenti':'da oggi in avanti'}</p></div><button class="text-btn" data-action="catech-past">${state.catechPast?'Solo prossimi incontri':'Mostra anche quelli passati'}</button></div>
    <div class="catech-agenda">${selectedMeetings.length?selectedMeetings.map(m=>{
      const g=getCatechGroup(m.group_id), d=shortDate(m.date_on),cancel=m.status==='cancelled';

    function richSongHtml(value){
      const raw=String(value||'');
      if(!/<(?:p|div|strong|b|em|i|br|table|tr|td|ul|ol|li)\b/i.test(raw))return '<p>'+esc(raw).replace(/\r?\n/g,'<br>')+'</p>';
      const doc=new DOMParser().parseFromString(raw,'text/html');
      const tags=new Set(['p','div','strong','em','b','i','br','table','tbody','tr','td','ul','ol','li']);
      const unsafe=new Set(['script','style','iframe','svg','math','object','embed','form','input','video','audio','link','meta']);
      function clean(node){
        if(node.nodeType===3)return esc(node.nodeValue||'');
        if(node.nodeType!==1)return '';
        const tag=node.tagName.toLowerCase();
        if(unsafe.has(tag))return '';
        const body=Array.from(node.childNodes).map(clean).join('');
        if(!tags.has(tag))return body;
        if(tag==='br')return '<br>';
        const klass=tag==='table' && node.classList.contains('sg-lyrics-cols')?' class="sg-lyrics-cols"':'';
        return '<'+tag+klass+'>'+body+'</'+tag+'>';
      }
      return Array.from(doc.body.childNodes).map(clean).join('');
    }

        cloud.client.auth.onAuthStateChange((_event,session)=>{const nextId=session?.user?.id||null;if(nextId!==(cloud.user?.id||null)){cloud.user=session?.user||null;if(cloud.user){state.page='admin';history.replaceState(null,'','#admin');}setTimeout(()=>loadCloud(),0)}});
        await loadCloud();
      }catch(err){cloud.loading=false;cloud.error=err?.message||String(err);render();}
    }
    async function loadCloud(){
      if(!cloud.client)return;cloud.loading=true;cloud.error='';render();
      try{
        cloud.role=null;
        if(cloud.user){const {data,error}=await cloud.client.from('admin_members').select('role').eq('user_id',cloud.user.id).maybeSingle();if(error)throw error;cloud.role=data?.role||null;}
        const responses=await Promise.all(tables.map(t=>cloud.client.from(t).select('*')));
        for(let i=0;i<tables.length;i++){if(responses[i].error)throw responses[i].error;content[tables[i]]=responses[i].data||[];}
        normalize();cloud.itemsLoaded=true;
      }catch(err){cloud.error=err?.message||String(err)}
      cloud.loading=false;render();
    }
    async function signIn(email,password){if(!cloud.client)throw new Error('Database non collegato.');const {data,error}=await cloud.client.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user)throw new Error('Accesso non riuscito.');cloud.user=data.user;state.page='admin';history.replaceState(null,'','#admin');await loadCloud();if(!isEditor())throw new Error('Accesso eseguito, ma l’utente non è abilitato nella tabella admin_members.');}
    async function logOut(){if(!cloud.client)return;const {error}=await cloud.client.auth.signOut();if(error)throw error;cloud.user=null;cloud.role=null;await loadCloud();}
    function normalizeMassTimes(raw){
      const parts=String(raw||'').replace(/\./g,':').split(/[;,]/).map(x=>x.trim()).filter(Boolean);
      if(!parts.length||parts.length>12)throw new Error('Inserisci da 1 a 12 orari, separati da virgola (es. 08:00, 11:00, 17:30).');
      const times=parts.map(t=>{const match=t.match(/^(\d{1,2})(?::(\d{2}))?$/);if(!match)throw new Error('Orario non valido: '+t+'. Usa HH:MM, separando le Messe con una virgola.');const h=Number(match[1]),m=Number(match[2]||'0');if(h>23||m>59)throw new Error('Orario non valido: '+t);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')});
      if(new Set(times).size!==times.length)throw new Error('Hai inserito due volte lo stesso orario.');
      return times.sort().join(', ');
    }
    const buildPayload=(t,fd)=>{
      const o={};
      for(const [k,,type] of adminDefs[t].fields){
        if(k==='category_select')continue; // campo UI, non colonna del database
        let v=String(fd.get(k)||'').trim();
        o[k]=type==='number'?Number(v||0):k==='times_text'?normalizeMassTimes(v):v;
      }
      if(t==='songs'){
        const editor=document.getElementById('sg-song-editor');
        if(!editor)throw new Error('Editor del canto non disponibile.');
        o.lyrics=richSongHtml(editor.innerHTML).trim();
        if(o.lyrics.length>12000)throw new Error('Il testo supera 12.000 caratteri. Riducilo prima di salvare.');
      }
      if(t==='catechism_groups'){
        if(!o.name?.trim()||!o.school_year?.trim())throw new Error('Inserisci nome e anno catechistico del gruppo.');
      }
      if(t==='catechism_meetings'){
        if(!o.group_id||!getCatechGroup(o.group_id))throw new Error('Seleziona un gruppo esistente.');
        if(!/^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(o.time_of_day))throw new Error('Inserisci un orario valido (HH:MM).');
        if(!['scheduled','cancelled'].includes(o.status))throw new Error('Stato non valido.');
        if(o.date_on&&!validCatechDate(o.date_on))throw new Error('Data incontro non valida.');
      }
      if(t==='mass_exceptions')o.collection_id=o.collection_id||null;
      o.published=fd.has('published');if(t==='notices')o.audience='public';
      if(t==='song_categories'||t==='song_slots'){
        const name=String(o.name||'').trim();if(!name)throw new Error('Inserisci il nome.');o.name=name;
      }
      if(t==='song_placements'){
        const cat=String(fd.get('category_select')||'');
        if(!o.slot_id||String(getSlot(o.slot_id)?.category_id)!==cat)throw new Error('Seleziona una categoria e un momento validi.');
      }
      return o;
    };
    function validCatechDate(iso){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(iso))return false;
      const [y,m,d]=iso.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));
      return dt.getUTCFullYear()===y&&dt.getUTCMonth()+1===m&&dt.getUTCDate()===d&&y>=2020&&y<=2100;
    }
    function parseCatechDates(raw){
      const tokens=String(raw||'').trim().split(/[\s,;]+/).filter(Boolean);
      if(!tokens.length)return [];
      if(tokens.length>80)throw new Error('Massimo 80 date per operazione.');
      const dates=tokens.map(x=>{
        const match=x.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        const date=match?match[3]+'-'+match[2]+'-'+match[1]:x;
        if(!validCatechDate(date))throw new Error('Data non valida: '+x+'. Usa GG/MM/AAAA o AAAA-MM-GG.');
        return date;
      });
      if(new Set(dates).size!==dates.length)throw new Error('Hai indicato due volte la stessa data.');
      return dates.sort();
    }
    async function saveContent(fd){
      const t=state.adminType,record=buildPayload(t,fd),edit=state.editingId;
      const previous=edit?content[t].find(x=>String(x.id)===String(edit)):null;
      const bulkDates=t==='catechism_meetings'&&!edit?parseCatechDates(fd.get('bulk_dates')):[];
      if(t==='catechism_meetings'&&!bulkDates.length&&!validCatechDate(record.date_on))throw new Error('Seleziona una data oppure incolla un elenco di date.');
      const records=bulkDates.length?bulkDates.map(date_on=>({...record,date_on})): [record];
      if(t==='catechism_meetings'){
        for(const row of records){
          if(content.catechism_meetings.some(m=>String(m.id)!==String(edit)&&String(m.group_id)===String(row.group_id)&&m.date_on===row.date_on&&String(m.time_of_day||'').slice(0,5)===row.time_of_day)){
            throw new Error('Esiste già un incontro per il gruppo alla data e ora '+row.date_on+' '+row.time_of_day+'.');
          }
        }
      }
      let savedId=edit,noticeDispatch='';
      if(cloud.enabled){
        if(!isEditor())throw new Error('Non autorizzato');
        const q=edit?cloud.client.from(t).update(record).eq('id',edit):cloud.client.from(t).insert(records.length===1?record:records);
        const {data,error}=await q.select('id');
        if(error)throw error;
        savedId=data?.[0]?.id;
        if(t==='song_categories'&&!edit&&fd.has('auto_slots')){
          const rows=SONG_MOMENTS.map((name,i)=>({category_id:savedId,name,sort_order:i,published:true}));
          const {error:slotsError}=await cloud.client.from('song_slots').insert(rows);
          if(slotsError){await loadCloud();throw new Error('Categoria creata, ma gli 8 slot non sono stati creati: '+slotsError.message);}
        }
        await loadCloud();
        if(t==='notices'&&record.published&&!previous?.published){
          try{
            const r=await sendPushNotification(savedId);
            noticeDispatch=r.alreadySent?' · Notifica già inviata':r.reason?' · '+r.reason:' · Notifiche: '+r.sent+' inviate'+(r.failed?', '+r.failed+' non riuscite':'');
          }catch(e){noticeDispatch=' · AVVISO PUBBLICATO, MA PUSH NON INVIATA: '+(e.message||String(e)).slice(0,100);}
        }
      }else {
        if(edit){const i=content[t].findIndex(x=>x.id===edit);if(i<0)throw new Error('Elemento non trovato');content[t][i]={...content[t][i],...record}}
        else {
          content[t].unshift(...records.map((row,i)=>({...row,id:(crypto.randomUUID?crypto.randomUUID():'demo-'+Date.now()+'-'+i+'-'+Math.random().toString(16).slice(2))})));
          savedId=content[t][0]?.id;
        }
        if(t==='song_categories'&&!edit&&fd.has('auto_slots')){
          content.song_slots.push(...SONG_MOMENTS.map((name,i)=>({id:'demo-slot-'+savedId+'-'+i,category_id:savedId,name,sort_order:i,published:true})));
        }
        saveDemo();
      }
      state.editingId=null;
      toast('Contenuto salvato '+(cloud.enabled?'nel database.':'nella demo locale.')+noticeDispatch);
    }
    async function deleteContent(t,id){
      if(t==='catechism_groups'&&content.catechism_meetings.some(m=>String(m.group_id)===String(id)))throw new Error('Questo gruppo ha incontri associati. Nascondilo togliendo Pubblica oppure elimina prima gli incontri.');
      if(cloud.enabled){if(!isEditor())throw new Error('Non autorizzato');if(['song_categories','song_slots'].includes(t)&&cloud.role!=='admin')throw new Error('Solo un amministratore può eliminare categorie o slot.');const {error}=await cloud.client.from(t).delete().eq('id',id);if(error)throw error;await loadCloud();}
      else {
        content[t]=content[t].filter(x=>String(x.id)!==String(id));
        if(t==='songs')content.song_placements=content.song_placements.filter(p=>String(p.song_id)!==String(id));
        if(t==='song_categories'){
          const removedIds=content.song_slots.filter(s=>String(s.category_id)===String(id)).map(s=>String(s.id));
          content.song_slots=content.song_slots.filter(s=>String(s.category_id)!==String(id));
          content.song_placements=content.song_placements.filter(p=>!removedIds.includes(String(p.slot_id)));
          if(String(state.songService)===String(id)){state.songService=null;state.songMoment=null;}
        }
        if(t==='mass_collections'){
          content.mass_exceptions=content.mass_exceptions.map(x=>String(x.collection_id)===String(id)?({...x,collection_id:null}):x);
        }
        if(t==='song_slots'){
          content.song_placements=content.song_placements.filter(p=>String(p.slot_id)!==String(id));
          if(String(state.songMoment)===String(id))state.songMoment=null;
        }
        saveDemo();
      }
      state.editingId=null;toast(t.startsWith('song_')?'Elemento eliminato. I testi dei canti sono conservati.':'Elemento eliminato.');
    }
    function confirmDelete(t,id){
      let message='Eliminare definitivamente questo contenuto?';
      if(t==='catechism_groups'){
        const n=content.catechism_meetings.filter(x=>String(x.group_id)===String(id)).length;
        if(n){toast('Prima elimina gli incontri del gruppo oppure rendilo non pubblicato.');return;}
        message='Eliminare definitivamente questo gruppo?';
      }
      if(t==='mass_collections'){
        const n=content.mass_exceptions.filter(x=>String(x.collection_id)===String(id)).length;
        message=`Eliminare questo riquadro? Le ${n} date collegate non saranno cancellate: resteranno tra le celebrazioni singole.`;
      }
      if(t==='song_categories'){
        const slots=allSlots(id),ids=new Set(slots.map(x=>String(x.id)));
        const used=content.song_placements.filter(p=>ids.has(String(p.slot_id))).length;
        message=`Eliminare definitivamente questa categoria? Verranno cancellati anche ${slots.length} slot e ${used} assegnazioni. I testi dei canti resteranno disponibili.\n\nPer conservarli per l'anno prossimo, modifica la categoria e togli la spunta Pubblica.`;
      }else if(t==='song_slots'){
        const used=content.song_placements.filter(p=>String(p.slot_id)===String(id)).length;
        message=`Eliminare definitivamente questo slot e le sue ${used} assegnazioni? I testi dei canti resteranno disponibili.\n\nPer nasconderlo temporaneamente, togli la spunta Pubblica.`;
      }
      if(window.confirm(message))deleteContent(t,id).catch(showError);
    }
    function showError(err){console.error(err);toast('Errore: '+(err?.message||String(err)).slice(0,160))}
    const renderModal=()=>{const m=state.modal;let title='',body='',label='';if(m.type==='notice'){let n=allNotices().find(x=>x.id===m.id);if(!n)return '';title=esc(n.title);label=esc(n.cat)+' · '+dateFmt(n.date);body=`<p>${esc(n.desc)}</p><div class="soft-note">${I('users',16)} Destinatari: ${esc(n.audience||'Tutta la comunità')}</div>`}else if(m.type==='song'){let s=songs.find(x=>x.id===m.id);if(!s)return '';title=esc(s.name);label='TESTO DEL CANTO';body=s.lyrics.trim()?`<div class="song-lyrics">${richSongHtml(s.lyrics)}</div>`:'<p>Testo non ancora disponibile.</p>';if(s.note)body+=`<div class="soft-note">${I('info',16)} ${esc(s.note)}</div>`}else if(m.type==='family'){title='Area famiglia · anteprima';label='SIMULAZIONE';body=`<div class="group-mini"><div><div class="group-name">Gruppo Aquila · secondo anno</div><div class="group-detail">Demo senza dati di una famiglia reale</div></div><span class="label-tag">Esempio</span></div><div class="day-evt"><strong>29 novembre · 10:00</strong><p>Incontro catechesi del gruppo Aquila</p></div><div class="day-evt"><strong>13 dicembre · 10:00</strong><p>Incontro catechesi del gruppo Aquila</p></div><div class="soft-note">${I('shield',16)} La registrazione e l'accesso vero dei genitori saranno attivati solo con autenticazione e informative adeguate.</div>`}else if(m.type==='registration'){title='Iscrizioni alla catechesi';label='FUNZIONE FUTURA';body=`<p>Il genitore potrà accedere con il proprio account, scegliere il percorso, compilare il modulo richiesto dalla parrocchia e ricevere conferma dal responsabile.</p><div class="soft-note">${I('shield',16)} In questa demo non chiediamo né salviamo dati di minori.</div>`}else if(m.type==='donation'){title='Donazioni non ancora attive';label='FUNZIONE FUTURA';body='<p>Per accettare bonifici o pagamenti online serviranno le coordinate ufficiali e la configurazione del servizio di pagamento intestato all’ente.</p>'}return `<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><button class="icon-btn close" data-action="close-modal" aria-label="Chiudi">${I('close',18)}</button><div class="overline">${label}</div><h2>${title}</h2>${body}<div class="form-actions"><button class="btn btn-primary" data-action="close-modal">Chiudi</button></div></div></div>`};
    const pageFns={home,avvisi,calendario,messe,liturgia,canti,meditazioni,catechesi,donazioni,admin};
    function render(opts={}){const app=document.getElementById('app');let active=document.activeElement,id=active&&active.id,pos=active&&typeof active.selectionStart==='number'?active.selectionStart:null;app.innerHTML=shell((pageFns[state.page]||home)());if(opts.keepFocus&&id){let el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}}}
    function go(p){if(!pageFns[p])p='home';if(p==='canti'&&state.page!=='canti'){state.songService=null;state.songMoment=null;}state.page=p;state.more=false;state.modal=null;history.replaceState(null,'','#'+p);render();window.scrollTo({top:0,behavior:'instant'})}
    function toast(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast=null;let t=document.querySelector('.toast');if(t)t.remove()}},3400)}
    const dtAdd=(v)=>{let n=new Date(state.year,state.month+v,1);state.year=n.getFullYear();state.month=n.getMonth();state.selectedDate=`${state.year}-${String(state.month+1).padStart(2,'0')}-01`};
    document.addEventListener('mousedown',e=>{if(e.target.closest('[data-editor-tool]'))e.preventDefault();});
    document.addEventListener('paste',e=>{if(e.target.closest('#sg-song-editor')){e.preventDefault();const val=e.clipboardData?.getData('text/plain')||'';document.execCommand('insertText',false,val);}});
    document.addEventListener('click',e=>{const button=e.target.closest('button,[data-action]');if(!button)return;
      if(button.hasAttribute('data-editor-tool')){
        const ed=document.getElementById('sg-song-editor');if(!ed)return;
        ed.focus();
        const tool=button.dataset.editorTool;
        if(tool==='bold'||tool==='italic')document.execCommand(tool,false,null);
        else if(tool==='paragraph')document.execCommand('insertHTML',false,'<p><br></p>');
        else if(tool==='columns'){
          const selection=window.getSelection();if(selection&&!selection.isCollapsed)selection.collapseToEnd();
          document.execCommand('insertHTML',false,'<table class="sg-lyrics-cols"><tbody><tr><td><p>Testo prima colonna</p></td><td><p>Testo seconda colonna</p></td></tr></tbody></table><p><br></p>');
        }
        return;
      }
      if(button.hasAttribute('data-go')){go(button.dataset.go);return}
      if(button.hasAttribute('data-notice')){state.modal={type:'notice',id:button.dataset.notice};render();return}
      if(button.hasAttribute('data-song-service')){state.songService=button.dataset.songService;state.songMoment=null;render();return}
      if(button.hasAttribute('data-song-moment')){state.songMoment=button.dataset.songMoment;render();return}
      if(button.hasAttribute('data-song')){state.modal={type:'song',id:button.dataset.song};render();return}
      if(button.hasAttribute('data-filter')){state.filter=button.dataset.filter;render();return}
      if(button.hasAttribute('data-songfilter')){state.songFilter=button.dataset.songfilter;render();return}
      if(button.hasAttribute('data-day')){state.selectedDate=button.dataset.day;render();return}
      if(button.hasAttribute('data-catech-open')){state.catechGroup=button.dataset.catechOpen;state.catechPast=false;render();document.querySelector('.catech-agenda')?.scrollIntoView({behavior:'smooth',block:'start'});return}
      if(button.hasAttribute('data-adminsection')){const group=adminSections.find(g=>g.id===button.dataset.adminsection);if(group){state.adminSection=group.id;state.adminType=group.types.find(t=>!['song_categories','song_slots'].includes(t)||!cloud.enabled||cloud.role==='admin')||group.types[0];state.editingId=null;render();}return}
      if(button.hasAttribute('data-admintype')){state.adminType=button.dataset.admintype;state.editingId=null;render();return}
      if(button.hasAttribute('data-edit')){state.editingId=button.dataset.edit;render();window.scrollTo({top:0,behavior:'smooth'});return}
      if(button.hasAttribute('data-push-send')){sendPushNotification(button.dataset.pushSend).then(r=>toast(r.alreadySent?'Notifica già inviata per questo avviso.':r.reason||('Notifiche inviate: '+r.sent+'; non riuscite: '+r.failed))).catch(showError);return}
      if(button.hasAttribute('data-delete')){confirmDelete(state.adminType,button.dataset.delete);return}
      if(button.hasAttribute('data-fav')){let id=button.dataset.fav;state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];saveStored(FAV,state.favs);render();return}
      switch(button.dataset.action){case 'song-home':state.songService=null;state.songMoment=null;render();break;case 'song-slots':state.songMoment=null;render();break;case 'attiva-push':enablePush();break;case 'disattiva-push':disablePush();break;case 'toggle-theme':state.theme=state.theme==='vivace'?'sobrio':'vivace';document.documentElement.dataset.theme=state.theme;saveStored(THEME,state.theme);render();break;
        case 'more':state.more=!state.more;render();break;case 'prev-month':dtAdd(-1);render();break;case 'next-month':dtAdd(1);render();break;
        case 'catech-reset':state.catechCourse='Tutti';state.catechGroup='Tutti';state.catechPast=false;render();break;case 'catech-past':state.catechPast=!state.catechPast;render();break;case 'family-preview':state.modal={type:'family'};render();break;case 'registration-demo':state.modal={type:'registration'};render();break;
        case 'donation-demo':state.modal={type:'donation'};render();break;case 'close-modal':state.modal=null;render();break;
        case 'cancel-edit':state.editingId=null;render();break;
        case 'logout':logOut().catch(showError);break;
        case 'modal-backdrop':if(e.target===button){state.modal=null;render()}break;default:break}
    });
    document.addEventListener('input',e=>{if(e.target.id==='notice-search'){state.search=e.target.value;render({keepFocus:true})}if(e.target.id==='song-search'){state.songSearch=e.target.value;render({keepFocus:true})}});
    document.addEventListener('change',e=>{
      if(e.target.id==='catech-course'){state.catechCourse=e.target.value;state.catechGroup='Tutti';render();return}
      if(e.target.id==='catech-group'){state.catechGroup=e.target.value;render();return}
      if(e.target.id==='mass-date'&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){state.massDate=e.target.value;render();}
      if(e.target.id==='field-category_select'){
        const slotSelect=document.getElementById('field-slot_id');
        if(slotSelect){
          slotSelect.innerHTML='<option value="">Scegli uno slot...</option>'+allSlots(e.target.value).map(sl=>`<option value="${esc(sl.id)}">${esc(sl.name)}${sl.published?'':' (nascosto)'}</option>`).join('');
        }
      }
    });
    document.addEventListener('submit',e=>{if(!['content-form','login-form'].includes(e.target.id))return;e.preventDefault();
      const fd=new FormData(e.target),submit=e.target.querySelector('button[type=submit]');if(submit){submit.disabled=true;submit.textContent='Operazione in corso...';}
      if(e.target.id==='content-form'){saveContent(fd).catch(showError).finally(()=>{if(submit?.isConnected){submit.disabled=false;render()}});}
      else {signIn(String(fd.get('email')||'').trim(),String(fd.get('password')||'')).then(()=>toast('Accesso amministratore effettuato.')).catch(showError).finally(()=>{if(submit?.isConnected)submit.disabled=false});}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
    window.addEventListener('hashchange',()=>{let h=location.hash.replace('#','');if(pageFns[h]&&h!==state.page){state.page=h;state.modal=null;render()}});
    let start=location.hash.replace('#','');if(pageFns[start])state.page=start;
    render();
    connectCloud();
    if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').then(()=>refreshPushStatus()).catch(()=>{push.status='unsupported';render()});
    else {push.status='unsupported';render();}
  })();
  </script>
